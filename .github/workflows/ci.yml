name: ci

on:
  push:
  pull_request:

jobs:
  console:
    name: typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Route types
        # Next generates LayoutProps and the route types into .next/types; a
        # clean checkout has none, so the typecheck needs them first.
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
