# The console on its own, on GKE, behind Google IAP.
# Replace every value in CAPITALS. deploy/console/README.md explains each.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
  annotations:
    # Workload Identity: the Google service account the console acts as when it lists Vertex AI's models.
    iam.gke.io/gcp-service-account: CONSOLE_GSA@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: Secret
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
type: Opaque
stringData:
  # Signs the console's session cookie. Any long random value: openssl rand -hex 32
  AUTH_SECRET: REPLACE_WITH_RANDOM
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels: {app: agentfactory-console}
  template:
    metadata:
      labels: {app: agentfactory-console}
    spec:
      serviceAccountName: agentfactory-console
      containers:
        - name: console
          image: IMAGE
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: AUTH_SECRET
              valueFrom: {secretKeyRef: {name: agentfactory-console, key: AUTH_SECRET}}
            # Switches IAP sign-in on. Filled in after the first deploy (README, step 4):
            # /projects/PROJECT_NUMBER/global/backendServices/BACKEND_SERVICE_ID
            - {name: IAP_AUDIENCE, value: "IAP_AUDIENCE"}
            # Who holds which role (platform_admin or auditor). A key is an address or "@domain"; anyone not named has no access.
            - name: IAP_ROLE_MAP
              value: '{"ADMIN@EXAMPLE.COM": "platform_admin", "AUDITOR@EXAMPLE.COM": "auditor"}'
            # Only when the pod cannot work them out itself (it asks the metadata server first).
            # - {name: GCP_PROJECT, value: PROJECT_ID}
            # - {name: REGION, value: europe-west4}
          startupProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
spec:
  iap:
    enabled: true
  healthCheck:
    type: HTTP
    requestPath: /login
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
  annotations:
    cloud.google.com/backend-config: '{"default": "agentfactory-console"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector: {app: agentfactory-console}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
spec:
  domains: [HOST]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: STATIC_IP_NAME
    networking.gke.io/managed-certificates: agentfactory-console
spec:
  defaultBackend:
    service:
      name: agentfactory-console
      port: {number: 80}
