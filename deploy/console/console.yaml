# The console on GKE, behind Google IAP, in front of the platform's service.
# Replace every value in CAPITALS. deploy/console/README.md explains each.
#
# The console keeps no secret and calls no Google API: it serves the pages and
# forwards every /api request to BACKEND_ORIGIN. IAP is on this console's
# backend service (BackendConfig below), and the platform's service verifies
# IAP's assertion on every request against its own IAP_AUDIENCE, which is
# this backend service's audience:
#   /projects/PROJECT_NUMBER/global/backendServices/BACKEND_SERVICE_ID
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels: {app: agentfactory-console}
  template:
    metadata:
      labels: {app: agentfactory-console}
    spec:
      containers:
        - name: console
          image: IMAGE
          ports:
            - {name: http, containerPort: 8080}
          env:
            # The platform's service as this pod reaches it. With the service's own manifests (its deploy/k8s/backend.yaml:
            # Service "agentfactory" in namespace "agentfactory", port 80) that is the address below; the container port
            # 8080 is not the Service's port.
            - {name: BACKEND_ORIGIN, value: "http://agentfactory.agentfactory.svc.cluster.local"}
          # /login is served by the console itself and always answers 200 once BACKEND_ORIGIN is set; without it, 503.
          startupProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
spec:
  iap:
    enabled: true
  # The chatbot streams one answer over several model calls (often 30-90 s); the load balancer's default of 30 s cuts it off. 3600 s matches the console's own 1-hour proxy limit.
  timeoutSec: 3600
  healthCheck:
    type: HTTP
    requestPath: /login
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
  annotations:
    cloud.google.com/backend-config: '{"default": "agentfactory-console"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector: {app: agentfactory-console}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
spec:
  domains: [HOST]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentfactory-console
  namespace: NAMESPACE
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: STATIC_IP_NAME
    networking.gke.io/managed-certificates: agentfactory-console
spec:
  defaultBackend:
    service:
      name: agentfactory-console
      port: {number: 80}
