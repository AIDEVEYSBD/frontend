# Run-time settings for the console on Cloud Run, passed with --env-vars-file.
# Every value is a string. AUTH_SECRET is not here: it comes from Secret Manager.
# The full list of names is in .env.example at the repository root.

# /projects/PROJECT_NUMBER/locations/REGION/services/SERVICE_NAME
IAP_AUDIENCE: "/projects/PROJECT_NUMBER/locations/REGION/services/agentfactory-console"

# Who holds which role: an address or "@domain" to platform_admin or auditor.
# Anyone not named has no access to the console.
IAP_ROLE_MAP: '{"FIRST.LAST@EXAMPLE.COM": "platform_admin", "AUDIT.PERSON@EXAMPLE.COM": "auditor"}'

# Only to override what the metadata server says.
# GCP_PROJECT: "PROJECT_ID"
# REGION: "europe-west4"

# The address of each workload's own console, once it is live. Leave out the ones that are not.
# WORKLOAD_URLS: '{"sast": "https://SAST-HOST", "pentest": "https://PENTEST-HOST", "firewall": "https://FIREWALL-HOST", "threat_hunt": "https://HUNT-HOST"}'
