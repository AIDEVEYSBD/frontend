# Run-time settings for the console on Cloud Run, passed with --env-vars-file.
# Every value is a string. The console reads nothing else at run time; sign-in,
# roles and every other setting are the platform service's.

# The service's address as this console reaches it: scheme, host and port. On Google Cloud this is the backend's
# internal load balancer, listening on port 80 (the backend's deploy/GCP.md, section 10.2).
BACKEND_ORIGIN: "http://BACKEND_ILB_IP"
